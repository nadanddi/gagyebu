<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>네이버페이 가계부 동기화 설정</title>
  <style>
    body { max-width: 720px; margin: 36px auto; padding: 0 20px; color: #202124; font: 14px Arial, sans-serif; }
    h1 { font-size: 22px; }
    label { display: block; margin: 18px 0 6px; font-weight: 700; }
    input { box-sizing: border-box; width: 100%; padding: 11px; border: 1px solid #bdc1c6; border-radius: 6px; }
    button { margin-top: 20px; padding: 10px 18px; border: 0; border-radius: 6px; background: #1a73e8; color: #fff; cursor: pointer; }
    #status { margin-left: 10px; color: #137333; }
    .note { color: #5f6368; line-height: 1.6; }
  </style>
</head>
<body>
  <h1>네이버페이 가계부 동기화 설정</h1>
  <p class="note">Apps Script를 웹 앱으로 배포한 뒤 실행 URL과 가계부 메뉴에서 발급한 토큰을 입력합니다. 네이버 로그인 비밀번호는 이 확장 프로그램이 읽거나 저장하지 않습니다.</p>
  <label for="webAppUrl">Apps Script 웹 앱 실행 URL</label>
  <input id="webAppUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec">
  <label for="syncToken">동기화 토큰</label>
  <input id="syncToken" type="password" autocomplete="off">
  <button id="save" type="button">저장</button><span id="status"></span>
  <script src="options.js"></script>
</body>
</html>
