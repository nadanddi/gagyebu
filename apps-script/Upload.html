<!doctype html><html lang="ko"><head><base target="_top">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/xlsx-populate@1.21.0/browser/xlsx-populate.min.js"></script>
<style>
body{font:14px Arial,sans-serif;color:#202124;margin:0;padding:22px}h1{font-size:20px;margin:0 0 8px}.note{color:#5f6368;margin-bottom:16px;line-height:1.5}label{display:block;font-weight:700;margin:12px 0 6px}input[type=text],input[type=month],input[type=file]{box-sizing:border-box;width:100%;padding:9px}input[type=file]{border:2px dashed #bdc1c6;border-radius:8px;background:#fafafa}button{border:0;border-radius:4px;padding:10px 16px;cursor:pointer}.primary{background:#1a73e8;color:white}.secondary{background:#f1f3f4;margin-left:8px}button:disabled{opacity:.5}#actions{margin-top:16px}#status{margin-top:14px;min-height:22px}.error{color:#b3261e}.ok{color:#137333}.file-row{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:12px;align-items:center;border-top:1px solid #e0e0e0;padding:10px 0}.file-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}.file-meta{color:#5f6368;font-size:12px;margin-top:3px}.password{box-sizing:border-box;width:100%;padding:8px}.result{border-top:1px solid #e0e0e0;padding:9px 0}.pill{background:#e8f0fe;border-radius:10px;color:#174ea6;font-size:12px;padding:2px 8px;margin-left:6px}.summary{margin-top:14px;padding:12px;background:#f8f9fa;border-radius:6px}
</style></head><body>
<h1>거래내역 여러 파일 업로드</h1>
<div class="note">PDF·CSV·XLS·XLSX를 섞어 한 번에 선택할 수 있습니다. 암호가 있는 파일만 해당 파일 옆 칸에 입력하세요. 암호는 브라우저 메모리에서만 사용되며 저장·전송되지 않습니다.</div>
<label for="ownerLabels">본인 계좌이체 식별 이름</label><input id="ownerLabels" type="text" placeholder="이름이나 표시명을 쉼표로 구분">
<label for="targetMonth">반영할 월</label><input id="targetMonth" type="month">
<label for="files">거래내역 파일</label><input id="files" type="file" multiple accept=".csv,.xls,.xlsx,.pdf,text/csv,application/pdf,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
<div id="fileList"></div><div id="actions"><button id="analyze" class="primary" onclick="analyzeAll()">전체 파일 분석</button><button id="commit" class="primary" onclick="commitAll()" disabled>가계부에 반영</button><button class="secondary" onclick="google.script.host.close()">닫기</button></div><div id="status"></div><div id="results"></div>
<script>
let analyzed=[],config=null,selectedFiles=[];
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const filesInput=document.getElementById('files');filesInput.addEventListener('change',renderSelectedFiles);
google.script.run.withSuccessHandler(v=>{config=v;document.getElementById('ownerLabels').value=v.ownerLabels||'';document.getElementById('targetMonth').value=v.targetMonth}).withFailureHandler(showError).getUploaderConfig();
function serverAnalyze(p){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||String(e)))).analyzeUploadedFile(p))}
function serverCommit(p){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||String(e)))).commitImportBatch(p))}
function renderSelectedFiles(){selectedFiles=[...filesInput.files];analyzed=[];document.getElementById('commit').disabled=true;document.getElementById('results').innerHTML='';document.getElementById('fileList').innerHTML=selectedFiles.map((f,i)=>'<div class="file-row"><div><div class="file-name">'+escapeHtml(f.name)+'</div><div class="file-meta">'+formatBytes(f.size)+'</div></div><input class="password" id="password-'+i+'" type="password" autocomplete="new-password" placeholder="암호 없음 (비워두기)" aria-label="'+escapeHtml(f.name)+' 암호"></div>').join('')}
async function analyzeAll(){const files=selectedFiles,ownerLabels=document.getElementById('ownerLabels').value.trim();if(!files.length)return showError({message:'파일을 한 개 이상 선택하세요.'});if(!ownerLabels)return showError({message:'본인 이체를 구분할 이름을 입력하세요.'});if(config&&files.reduce((s,f)=>s+f.size,0)>config.maxBatchBytes)return showError({message:'선택한 파일의 합계는 25MB 이하여야 합니다.'});const unsupported=files.find(f=>!/\.(csv|xls|xlsx|pdf)$/i.test(f.name));if(unsupported)return showError({message:'지원하지 않는 파일입니다: '+unsupported.name});const tooLarge=files.find(f=>config&&f.size>config.maxFileBytes);if(tooLarge)return showError({message:'8MB를 넘는 파일입니다: '+tooLarge.name});analyzed=[];setBusy(true);document.getElementById('results').innerHTML='';try{for(let i=0;i<files.length;i++){const file=files[i],passwordInput=document.getElementById('password-'+i),password=passwordInput?passwordInput.value:'';setStatus((i+1)+'/'+files.length+' 분석 중: '+escapeHtml(file.name));const prepared=await prepareForAnalysis(file,password);if(passwordInput)passwordInput.value='';const result=await serverAnalyze({name:file.name,mimeType:file.type,base64:await readBase64(file),ownerLabels,extractedText:prepared.text||'',pdfEncrypted:prepared.encrypted||false,analysisBase64:prepared.analysisBase64||'',analysisMimeType:prepared.analysisMimeType||''});analyzed.push(result);renderFile(result)}renderSummary();setStatus('모든 파일 분석이 끝났습니다. 결과를 확인하고 반영하세요.','ok');document.getElementById('commit').disabled=false}catch(e){showError(e)}finally{setBusy(false,true)}}
async function prepareForAnalysis(file,password){if(/\.pdf$/i.test(file.name))return extractPdfText(file,password);if(/\.xlsx$/i.test(file.name)&&password){if(!window.XlsxPopulate)throw new Error('암호화 XLSX 해제 모듈을 불러오지 못했습니다. 창을 닫고 다시 시도하세요.');try{const workbook=await XlsxPopulate.fromDataAsync(await file.arrayBuffer(),{password});const decrypted=await workbook.outputAsync();return{analysisBase64:await readBase64(decrypted),analysisMimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}}catch(e){throw new Error('XLSX 암호가 맞지 않거나 지원하지 않는 암호화 형식입니다: '+file.name)}}if(/\.xls$/i.test(file.name)&&password)throw new Error('암호화된 구형 XLS는 지원하지 않습니다. XLSX로 다시 저장한 뒤 업로드하세요: '+file.name);return{}}
async function extractPdfText(file,password){if(!window.pdfjsLib)throw new Error('PDF 읽기 모듈을 불러오지 못했습니다.');let pdf;try{pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer()),password:password||undefined}).promise}catch(e){if(e&&e.name==='PasswordException')throw new Error((password?'PDF 암호가 맞지 않습니다: ':'PDF 암호를 입력하세요: ')+file.name);throw new Error('PDF를 읽지 못했습니다: '+file.name)}const pages=[];for(let n=1;n<=pdf.numPages;n++){const page=await pdf.getPage(n),content=await page.getTextContent();pages.push(content.items.map(item=>item.str+(item.hasEOL?'\n':' ')).join(''))}return{text:pages.join('\n'),encrypted:Boolean(password)}}
async function commitAll(){if(!analyzed.length)return;const targetMonth=document.getElementById('targetMonth').value,ownerLabels=document.getElementById('ownerLabels').value.trim();if(!targetMonth)return showError({message:'반영할 월을 선택하세요.'});setBusy(true);setStatus('중복 거래와 결제 영수증을 대조해 반영하는 중입니다.');try{const r=await serverCommit({files:analyzed,targetMonth,ownerLabels});document.getElementById('results').innerHTML+='<div class="summary ok"><strong>반영 완료</strong><br>신규 거래 '+r.added.toLocaleString()+'건 · 중복 제외 '+r.duplicate.toLocaleString()+'건 · 카카오페이 매칭 '+(r.detailMatched||0).toLocaleString()+'건 · 미일치 '+(r.detailUnmatched||0).toLocaleString()+'건</div>';setStatus('가계부 반영이 완료되었습니다.','ok');document.getElementById('commit').disabled=true}catch(e){showError(e)}finally{setBusy(false,true)}}
function readBase64(blob){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=reject;reader.readAsDataURL(blob)})}
function renderFile(r){document.getElementById('results').innerHTML+='<div class="result"><strong>'+escapeHtml(r.fileName)+'</strong><span class="pill">'+escapeHtml(r.bank)+'</span><br>'+r.count.toLocaleString()+'건 · 기간 '+r.periods.map(escapeHtml).join(', ')+(r.warnings.length?'<br><span class="error">'+r.warnings.map(escapeHtml).join(' / ')+'</span>':'')+'</div>'}
function renderSummary(){document.getElementById('results').innerHTML+='<div class="summary"><strong>전체 미리보기</strong><br>'+analyzed.length+'개 파일 · '+analyzed.reduce((s,f)=>s+f.count,0).toLocaleString()+'건 · 표시금액 '+analyzed.reduce((s,f)=>s+f.spend,0).toLocaleString()+'원</div>'}
function setBusy(busy,keepCommit){document.getElementById('analyze').disabled=busy;if(!keepCommit)document.getElementById('commit').disabled=busy||!analyzed.length;filesInput.disabled=busy;document.querySelectorAll('.password').forEach(el=>el.disabled=busy)}function setStatus(message,className){const el=document.getElementById('status');el.className=className||'';el.innerHTML=message}function showError(e){setStatus(escapeHtml(e.message||String(e)),'error');setBusy(false,true)}function escapeHtml(v){const d=document.createElement('div');d.textContent=String(v);return d.innerHTML}function formatBytes(b){return b<1048576?Math.ceil(b/1024)+'KB':(b/1048576).toFixed(1)+'MB'}
</script></body></html>
